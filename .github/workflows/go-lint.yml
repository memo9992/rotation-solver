name: Go Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Run go mod tidy
        run: |
          go mod tidy
          if [ -n "$(go mod tidy 2>&1)" ]; then
            echo "go mod tidy produced output - dependencies may be out of sync"
            exit 1
          fi

      - name: Run go fmt
        run: |
          go fmt ./...
          if [ -n "$(git diff --name-only)" ]; then
            echo "go fmt produced changes - code is not properly formatted"
            exit 1
          fi
